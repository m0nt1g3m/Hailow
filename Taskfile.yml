version: '3'

tasks:
  update-submodules:
    desc: Updates all Git submodules recursively to their latest remote commits and merges changes.
    cmds:
      - git submodule update --remote --rebase --recursive

  get-dev-branches:
    desc: Checkout and pull dev branch for all submodules.
    cmds:
      - git submodule foreach --recursive 'git checkout dev && git pull origin dev'

  setup-symlinks:
    desc: Creates symlinks for the shared .env file in all service subdirectories.
    cmds:
      - |
        SERVICES=(
          "HailowApiGateway"
          "HailowAuthService"
          "HailowProductService"
          "HailowPaymentService"
          "HailowCartService"
          "HailowOrderService"
          "HailowSellerService"
        )
        for service in "${SERVICES[@]}"; do
          if [ -d "$service" ]; then
            echo "  → $service"
            cd "$service"
            rm -f .env
            ln -s ../.env .env
            cd ..
          else
            echo "  ⚠️ $service not found (skipping)"
          fi
        done
        echo "✅ Symlinks created!"
        
  setup-symlinks-win:
    desc: Creates symlinks for the shared .env file in all service subdirectories (Windows).
    cmds:
      - |
        $SERVICES = @("HailowApiGateway", "HailowAuthService", "HailowProductService", "HailowPaymentService", "HailowCartService", "HailowOrderService", "HailowSellerService")
        foreach ($service in $SERVICES) {
          if (Test-Path $service) {
            Write-Host "  → $service"
            Remove-Item -Path "$service\.env" -Force -ErrorAction SilentlyContinue
            New-Item -ItemType SymbolicLink -Path "$service\.env" -Target "..\.env" | Out-Null
          } else {
            Write-Host "  ⚠️ $service not found (skipping)"
          }
        }
        Write-Host "✅ Symlinks created!"

  fstart:
    desc: Builds and starts all services using Docker Compose.
    cmds:
      - docker-compose up -d --build