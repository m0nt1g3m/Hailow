  #     - .env
  #   depends_on:
  #     - postgres
  #   networks:
  #     - hailow-network

  # # Cart service
  # cart-service:
  #   build:
  #     context: ./HailowCartService
  #     dockerfile: Dockerfile
  #   container_name: hailow-cart-service
  #   ports:
